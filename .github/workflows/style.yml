name: Style

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  changed:
    uses: ./.github/workflows/changed.yml

  spellcheck:
    name: Spelling
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        show-progress: false
    - uses: codespell-project/actions-codespell@master
      with:
        exclude_file: ./.github/codespell-exclude
        skip: jquery-*.min.js

  java:
    name: Code Style (Java)
    runs-on: ubuntu-latest
    needs: changed
    if: ${{ needs.changed.outputs.java == 'true' || needs.changed.outputs.actions == 'true' || needs.changed.outputs.testdata == 'true' }}


    steps:
    - uses: actions/checkout@v5
    - name: Set up JDK 25
      uses: actions/setup-java@v5
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: maven
    - name: Run Checkstyle
      run: mvn checkstyle:check
      working-directory: ./java

  python:
    name: Code Style (Python)
    runs-on: ubuntu-latest
    needs: changed
    if: ${{ needs.changed.outputs.python == 'true' || needs.changed.outputs.actions == 'true' || needs.changed.outputs.testdata == 'true' }}


    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-python@v5
      with:
        python-version: '3.x'
    - name: Install dev dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
      working-directory: ./python
    - name: Test
      run: pylint ./weftspace
      working-directory: ./python
